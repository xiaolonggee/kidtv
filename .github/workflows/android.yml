name: Android checks and unsigned APK
on:
  push:
    branches: [main, 'feat/review-parent-1.5.5', 'feat/series-grid-1.5.6']
  workflow_dispatch:
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android/**/*.gradle.kts
      - name: Verify preinstalled SDK (never install or accept licenses)
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties
      - name: Test, lint and build unsigned release
        working-directory: android
        run: ./gradlew --no-daemon -Dorg.gradle.workers.max=2 -Pandroid.builder.sdkDownload=false -PunsignedRelease=true -Proborazzi.test.record=true --continue assembleRelease lintRelease testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KidTV-1.5.6-series-grid-build
          path: |
            android/app/build/outputs/apk/release/*unsigned.apk
            android/app/build/reports/tests/
            android/app/build/test-results/
            android/app/build/outputs/roborazzi/
            android/app/build/reports/lint-results-release.*
          if-no-files-found: warn
